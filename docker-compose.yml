version: "3.8"

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: effluent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-effluent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-effluent_pass}
      POSTGRES_DB: ${POSTGRES_DB:-effluent_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-effluent_user} -d ${POSTGRES_DB:-effluent_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: effluent_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-effluent_user}:${POSTGRES_PASSWORD:-effluent_pass}@postgres_db:5432/${POSTGRES_DB:-effluent_db}
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-effluent_user}:${POSTGRES_PASSWORD:-effluent_pass}@postgres_db:5432/${POSTGRES_DB:-effluent_db}
      SECRET_KEY: ${SECRET_KEY:-industrial_effluent_secret_key_production_2026}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-""}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-""}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-""}
      ENABLE_EMAIL_ALERTS: ${ENABLE_EMAIL_ALERTS:-"true"}
      DEFAULT_CRITICAL_THRESHOLD: ${DEFAULT_CRITICAL_THRESHOLD:-"75.0"}
      CORS_ORIGINS: ${CORS_ORIGINS:-"http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"}
    depends_on:
      postgres_db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

volumes:
  postgres_data:
